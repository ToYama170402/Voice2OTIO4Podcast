[project]
name = "podcastpreprocessor"
version = "0.1.0"
description = "Generate linked OpenTimelineIO timelines from podcast transcription"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "faster-whisper>=1.1.0",
  "onnxruntime>=1.14.1,<1.24",
  "opentimelineio>=0.17.0",
  "sudachipy>=0.6.8",
  "sudachidict_core>=20230110",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
sensevoice = ["numpy>=1.24", "sherpa-onnx>=2.0.1", "soundfile>=0.12.1"]

[project.scripts]
podcast-preprocessor = "podcastpreprocessor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
