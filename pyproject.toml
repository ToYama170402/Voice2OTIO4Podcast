[project]
name = "podcastpreprocessor"
version = "0.1.0"
description = "Generate linked FCP7 XML timelines from podcast transcription"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["faster-whisper>=1.1.0", "onnxruntime>=1.14.1,<1.24"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
podcast-preprocessor = "podcastpreprocessor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
